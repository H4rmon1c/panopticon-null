name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  reproducible-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Test Nix retry gate
        run: bash .github/scripts/test-retry-nix-flake-check.sh
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@21a544727d0c62386e78b4befe52d19ad12692e3 # v17
      - name: Check flake
        # `nix flake check` resolves Cargo.lock through importCargoLock and
        # fetches .crate archives from static.crates.io. The crates.io CDN can
        # transiently return HTTP 403/5xx for a specific crate (an upstream
        # availability failure, not a source-code error). This wrapper retries
        # only those transient download failures and fails immediately on any
        # genuine source-code/eval/build error, so a real defect is never
        # masked and `nix flake check` stays required.
        run: bash .github/scripts/retry-nix-flake-check.sh
      - name: Format
        run: nix develop --command cargo fmt --all --check
      - name: Clippy
        run: nix develop --command cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Test offline fixtures
        run: nix develop --command cargo test --workspace --all-features
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Cross-check checked document proposals through atlas, coverage, and alerts
        run: nix develop --command node --test web/panopticon-terminal/scripts/test-proposal-bridge.mjs
      - name: Cross-check combined Rust preview in browser validator
        shell: bash
        run: |
          set -euo pipefail
          nix develop --command cargo run --locked -q -p pnull-cli -- atlas export --preview \
            --manifest fixtures/atlas/colorado-springs-25-93.v1.json \
            --manifest fixtures/atlas/cases/commerce-city-ord-2755-2026-04-06.v2.json \
            --manifest fixtures/atlas/cases/commerce-city-ord-2756-2026-04-06.v2.json \
            --manifest fixtures/atlas/cases/castle-rock-res-2025-071.v2.json \
            --manifest fixtures/atlas/cases/denver-25-0413-2025-05-05.v2.json \
            --manifest fixtures/atlas/preview-cases/arapahoe-county-24-633-2024-11-26.v2.json \
            --manifest fixtures/atlas/preview-cases/arapahoe-county-25-378-2025-07-22.v2.json \
            --manifest fixtures/atlas/preview-cases/denver-25-1967-2025-12-08.v2.json \
            --manifest fixtures/atlas/preview-cases/denver-25-1968-2025-12-08.v2.json \
            --output /tmp/pnull-colorado-combined-preview.json
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import { validateSnapshot } from './web/panopticon-terminal/api.js';
          import { portraitForRecordedVote } from './web/panopticon-terminal/portraits/portraits.js';
          const snapshot = JSON.parse(readFileSync('/tmp/pnull-colorado-combined-preview.json', 'utf8'));
          validateSnapshot(snapshot, { preview: true });
          const decisions = snapshot.entities.filter((entity) => entity.type === 'DECISION');
          const consent = decisions.filter((entity) => entity.vote_record_state === 'consent_block');
          const voters = snapshot.entities.filter((entity) => entity.type === 'RECORDED_VOTER');
          const blockRows = consent.map((entity) => entity.consent_block?.roll_call?.length).sort((a, b) => a - b);
          if (decisions.length !== 9 || snapshot.case_releases.length !== 9 ||
              consent.length !== 4 || consent.some((entity) => entity.votes.length) ||
              voters.length !== 44 || JSON.stringify(blockRows) !== JSON.stringify([4, 5, 13, 13])) {
            throw new Error('Combined Colorado preview lost a decision or release binding');
          }
          const voterById = new Map(voters.map((voter) => [voter.id, voter]));
          for (const decision of decisions.filter((entity) =>
            entity.slug.includes('colorado-springs') || entity.slug.includes('commerce-city') || entity.slug.includes('castle-rock'))) {
            if (!decision.votes.length || decision.votes.some((vote) =>
              !portraitForRecordedVote(vote, voterById.get(vote.voter_entity_id)))) {
              throw new Error(`Reviewed portrait association is missing from ${decision.slug}`);
            }
          }
          NODE
      - name: Enable unprivileged user namespaces for bubblewrap
        # ubuntu-24.04 GitHub Actions runners restrict unprivileged user
        # namespaces by default (kernel.apparmor_restrict_unprivileged_userns=1),
        # which makes the nix-built (non-setuid) bubblewrap's new-network-namespace
        # loopback setup fail with "RTM_NEWADDR: Operation not permitted".
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Real sandbox extraction (Bubblewrap + Poppler)
        # Nested Bubblewrap is unsupported inside the Nix derivation, so the
        # real sandbox integration test is #[ignore]d there and is run here,
        # outside the derivation, where real Bubblewrap and Poppler execute.
        # This step fails if PDF extraction does not work.
        run: nix develop --command cargo test -p pnull-ingest --test real_sandbox_pdf -- --ignored --nocapture
      - name: Real sandbox extraction (Word documents)
        run: nix develop --command bash -c 'PNUL_EXTRACTOR_PATH="$PATH" python3 scripts/test-docx-sandbox.py'
      - name: Verify county budget portrait streams
        run: nix develop --command bash -c 'PNUL_EXTRACTOR_PATH="$PATH" python3 scripts/test-arapahoe-portraits.py'
      - name: Verify 2024 county budget portrait streams
        run: nix develop --command bash -c 'PNUL_EXTRACTOR_PATH="$PATH" python3 scripts/test-arapahoe-2024-portraits.py'
      - name: Verify Littleton source portraits and lossless display copies
        run: |
          nix develop --command bash -c 'PNUL_EXTRACTOR_PATH="$PATH" python3 scripts/test-littleton-portraits.py'
          nix develop --command bash -c 'PNUL_EXTRACTOR_PATH="$PATH" python3 scripts/test-littleton-2024-portraits.py'
      - name: Verify Commerce City portrait positions and original JPEGs
        run: nix develop --command bash -c 'PNUL_EXTRACTOR_PATH="$PATH" python3 scripts/test-commerce-portraits.py'
      - name: Verify Denver 2019 portrait positions and original JPEGs
        run: nix develop --command bash -c 'PNUL_EXTRACTOR_PATH="$PATH" python3 scripts/test-denver-2019-portraits.py'
      - name: Dependency policy
        run: nix develop --command cargo deny check
