name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  reproducible-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v17
      - name: Check flake
        # `nix flake check` resolves Cargo.lock through importCargoLock and
        # fetches .crate archives from static.crates.io. The crates.io CDN can
        # transiently return HTTP 403/5xx for a specific crate (an upstream
        # availability failure, not a source-code error). This wrapper retries
        # only those transient download failures and fails immediately on any
        # genuine source-code/eval/build error, so a real defect is never
        # masked and `nix flake check` stays required.
        run: bash .github/scripts/retry-nix-flake-check.sh
      - name: Format
        run: nix develop --command cargo fmt --all --check
      - name: Clippy
        run: nix develop --command cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Test offline fixtures
        run: nix develop --command cargo test --workspace --all-features
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Cross-check combined Rust preview in browser validator
        shell: bash
        run: |
          set -euo pipefail
          nix develop --command cargo run --locked -q -p pnull-cli -- atlas export --preview \
            --manifest fixtures/atlas/colorado-springs-25-93.v1.json \
            --manifest fixtures/atlas/cases/commerce-city-ord-2755-2026-04-06.v2.json \
            --manifest fixtures/atlas/cases/commerce-city-ord-2756-2026-04-06.v2.json \
            --manifest fixtures/atlas/cases/castle-rock-res-2025-071.v2.json \
            --manifest fixtures/atlas/cases/denver-25-0413-2025-05-05.v2.json \
            --manifest fixtures/atlas/preview-cases/arapahoe-county-24-633-2024-11-26.v2.json \
            --output /tmp/pnull-colorado-combined-preview.json
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import { validateSnapshot } from './web/panopticon-terminal/api.js';
          const snapshot = JSON.parse(readFileSync('/tmp/pnull-colorado-combined-preview.json', 'utf8'));
          validateSnapshot(snapshot, { preview: true });
          const decisions = snapshot.entities.filter((entity) => entity.type === 'DECISION');
          if (decisions.length !== 6 || snapshot.case_releases.length !== 6) {
            throw new Error('Combined Colorado preview lost a decision or release binding');
          }
          NODE
      - name: Enable unprivileged user namespaces for bubblewrap
        # ubuntu-24.04 GitHub Actions runners restrict unprivileged user
        # namespaces by default (kernel.apparmor_restrict_unprivileged_userns=1),
        # which makes the nix-built (non-setuid) bubblewrap's new-network-namespace
        # loopback setup fail with "RTM_NEWADDR: Operation not permitted".
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Real sandbox extraction (Bubblewrap + Poppler)
        # Nested Bubblewrap is unsupported inside the Nix derivation, so the
        # real sandbox integration test is #[ignore]d there and is run here,
        # outside the derivation, where real Bubblewrap and Poppler execute.
        # This step fails if PDF extraction does not work.
        run: nix develop --command cargo test -p pnull-ingest --test real_sandbox_pdf -- --ignored --nocapture
      - name: Dependency policy
        run: nix develop --command cargo deny check
