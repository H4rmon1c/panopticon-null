[workspace]
members = [
  "crates/pnull-core",
  "crates/pnull-ingest",
  "crates/pnull-detect",
  "crates/pnull-publish",
  "crates/pnull-x",
  "crates/pnull-http",
  "crates/pnull-geometry",
  "crates/pnull-procurement",
  "crates/pnull-cli",
]
resolver = "2"

[workspace.package]
version = "0.0.4"
edition = "2024"
rust-version = "1.89"
license = "AGPL-3.0-or-later"
repository = "https://github.com/H4rmon1c/panopticon-null"

[workspace.dependencies]
anyhow = "1.0.99"
clap = { version = "4.5.45", features = ["derive", "env"] }
hex = "0.4.3"
quick-xml = "0.41.0"
regex = "1.11.1"
reqwest = { version = "0.12.23", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rusqlite = { version = "0.32.1", features = ["bundled"] }
scraper = "0.24.0"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
serde_yaml = "0.9.34"
sha2 = "0.10.9"
tempfile = "3.21.0"
thiserror = "2.0.16"
time = { version = "0.3.41", features = ["formatting", "parsing", "serde"] }
toml = "0.9.5"
url = { version = "2.5.7", features = ["serde"] }
wait-timeout = "0.2.1"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
