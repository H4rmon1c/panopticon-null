<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Commerce City: two Flock votes, 7 to 2 each</title>
  <desc id="desc">On April 6, 2026, Commerce City Council approved the format of a Flock camera and drone agreement and a separate 608,900 dollar expansion budget. Each final ordinance passed seven Aye to two Nay. Signing, payment, and deployment are not established by the cited decision records.</desc>
  <rect width="1200" height="675" fill="#071019"/>
  <path d="M0 0h1200v12H0z" fill="#31d9ca"/>
  <text x="64" y="66" fill="#31d9ca" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="700" letter-spacing="3">PANOPTICON.FAIL / COLORADO PUBLIC RECORD</text>
  <text x="64" y="158" fill="#f4f7f7" font-family="DejaVu Sans, sans-serif" font-size="72" font-weight="800">COMMERCE CITY</text>
  <text x="64" y="218" fill="#c8d6d9" font-family="DejaVu Sans, sans-serif" font-size="34">Two Flock votes. Same 7–2 split.</text>
  <rect x="64" y="267" width="516" height="231" rx="18" fill="#10232d" stroke="#31515b" stroke-width="2"/>
  <rect x="620" y="267" width="516" height="231" rx="18" fill="#10232d" stroke="#31515b" stroke-width="2"/>
  <text x="92" y="309" fill="#31d9ca" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="700" letter-spacing="2">ORDINANCE 2755</text>
  <text x="648" y="309" fill="#31d9ca" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="700" letter-spacing="2">ORDINANCE 2756</text>
  <text x="92" y="362" fill="#f4f7f7" font-family="DejaVu Sans, sans-serif" font-size="36" font-weight="700">Agreement format</text>
  <text x="92" y="397" fill="#bdced2" font-family="DejaVu Sans, sans-serif" font-size="19">License plate readers + drones</text>
  <text x="648" y="376" fill="#f4f7f7" font-family="DejaVu Sans, sans-serif" font-size="54" font-weight="800">$608,900</text>
  <text x="648" y="408" fill="#bdced2" font-family="DejaVu Sans, sans-serif" font-size="19">Expansion budget appropriation</text>
  <text x="92" y="465" fill="#31d9ca" font-family="DejaVu Sans, sans-serif" font-size="29" font-weight="800">7 AYE</text>
  <text x="225" y="465" fill="#d6a887" font-family="DejaVu Sans, sans-serif" font-size="29" font-weight="800">2 NAY</text>
  <text x="648" y="465" fill="#31d9ca" font-family="DejaVu Sans, sans-serif" font-size="29" font-weight="800">7 AYE</text>
  <text x="781" y="465" fill="#d6a887" font-family="DejaVu Sans, sans-serif" font-size="29" font-weight="800">2 NAY</text>
  <path d="M64 537h1072" stroke="#31515b" stroke-width="2"/>
  <text x="64" y="575" fill="#f4f7f7" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="700">APRIL 6, 2026</text>
  <text x="64" y="612" fill="#bdced2" font-family="DejaVu Sans, sans-serif" font-size="21">What was later signed, paid for, or deployed?</text>
  <text x="64" y="647" fill="#718f98" font-family="DejaVu Sans, sans-serif" font-size="15">City final minutes + named roll calls linked in the evidence card</text>
